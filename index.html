<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكاشير وإدارة السوبر ماركت - الوضع الليلي</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#38bdf8', // Light blue suitable for dark mode
                        secondary: '#0f172a', // Sidebar dark
                        success: '#22c55e', 
                        danger: '#ef4444', 
                        warning: '#f59e0b', 
                        background: '#020617', // Very dark slate (Main background)
                        surface: '#0f172a', // Dark slate (Cards and tables)
                        surfaceAlt: '#1e293b', // Lighter slate (Inputs, headers)
                        borderDark: '#334155' // Border color
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow: hidden; 
        }
        
        /* Custom Scrollbar for Dark Mode */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Thermal Print Styles (80mm) matching requested layout */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                margin: 0;
                padding: 4px;
                font-family: 'Arial', sans-serif;
                color: black !important;
                background-color: white !important;
            }
            .no-print { display: none !important; }
            @page { margin: 0; }

            /* Specific Print Table Styles */
            .print-receipt {
                background-color: white;
                color: black;
                font-weight: bold;
                font-size: 14px;
            }
            .print-table {
                width: 100%;
                border-collapse: collapse;
                border: 2px solid #000;
                margin-bottom: 8px;
            }
            .print-table th, .print-table td {
                border: 1px solid #000;
                padding: 4px;
                text-align: center;
                color: black !important;
            }
            .totals-table {
                width: 65%;
                border-collapse: collapse;
                border: 2px solid #000;
                float: left;
                margin-bottom: 10px;
            }
            .totals-table td {
                border: 1px solid #000;
                padding: 4px;
                color: black !important;
            }
            .totals-table td:first-child { text-align: right; padding-right: 8px; }
            .totals-table td:last-child { text-align: center; }
            .clear-both { clear: both; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useMemo, useRef } = React;

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        }

        const formatCurrency = (num) => new Intl.NumberFormat('ar-EG', { style: 'currency', currency: 'EGP' }).format(num || 0);
        const formatDate = (dateStr) => new Intl.DateTimeFormat('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(dateStr));
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [products, setProducts] = useLocalStorage('pos_products', []);
            const [sales, setSales] = useLocalStorage('pos_sales', []);
            const [expenses, setExpenses] = useLocalStorage('pos_expenses', []);
            
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [printData, setPrintData] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const value = {
                products, setProducts,
                sales, setSales,
                expenses, setExpenses,
                activeTab, setActiveTab,
                showToast,
                printData, setPrintData
            };

            return (
                <AppContext.Provider value={value}>
                    {children}
                    
                    {toast && (
                        <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-xl text-white font-bold z-[100] flex items-center gap-3 transition-all animate-bounce ${toast.type === 'error' ? 'bg-danger' : 'bg-success'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'} text-xl`}></i>
                            {toast.message}
                        </div>
                    )}

                    {/* Hidden Print Area - Matching exactly the provided image structure */}
                    <div id="print-area" className="hidden print:block bg-white text-black">
                        {printData && (
                            <div dir="rtl" className="print-receipt bg-white text-black p-1">
                                
                                {/* Top Header Table */}
                                <table className="print-table">
                                    <tbody>
                                        <tr>
                                            <td className="w-1/4">رقم الطاولة</td>
                                            <td className="w-1/4">--</td>
                                            <td className="w-1/4">رقم الطلبية</td>
                                            <td className="w-1/4">{printData.id.replace('INV-', '').slice(-4)}</td>
                                        </tr>
                                    </tbody>
                                </table>

                                {/* Date & Time Info */}
                                <div className="flex justify-between items-center px-1 mb-2">
                                    <span>الساعة: {new Date(printData.date).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})}</span>
                                    <span>التاريخ: {new Date(printData.date).toLocaleDateString('en-GB')}</span>
                                </div>
                                <div className="text-center mb-3">
                                    اسم العميل: عميل نقدي
                                </div>

                                {/* Items Table */}
                                <table className="print-table">
                                    <thead>
                                        <tr>
                                            <th className="w-2/5">الصنف</th>
                                            <th className="w-1/5">الكمية</th>
                                            <th className="w-1/5">السعر</th>
                                            <th className="w-1/5">الإجمالي</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {printData.items.map((item, idx) => (
                                            <tr key={idx}>
                                                <td>{item.name}</td>
                                                <td>{item.qty}</td>
                                                <td>{item.price.toFixed(2)}</td>
                                                <td>{item.total.toFixed(2)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>

                                {/* Totals Section (Left Aligned) */}
                                <div>
                                    <table className="totals-table">
                                        <tbody>
                                            <tr>
                                                <td>الإجمالي</td>
                                                <td>{printData.total.toFixed(2)}</td>
                                            </tr>
                                            <tr>
                                                <td>الخصم</td>
                                                <td>0.00</td>
                                            </tr>
                                            <tr>
                                                <td>المبلغ للدفع</td>
                                                <td>{printData.total.toFixed(2)}</td>
                                            </tr>
                                            <tr>
                                                <td>المبلغ المدفوع</td>
                                                <td>{printData.paid.toFixed(2)}</td>
                                            </tr>
                                            <tr>
                                                <td>المتبقي</td>
                                                <td>{printData.change.toFixed(2)}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div className="clear-both"></div>

                                {/* Footer */}
                                <div className="mt-3 pt-2 border-t-[3px] border-double border-black text-center">
                                    <p>إدارة سوبر ماركت النور</p>
                                    <p>للتواصل والاستفسار جوال: 01000000000</p>
                                </div>
                            </div>
                        )}
                    </div>
                </AppContext.Provider>
            );
        };

        const useAppContext = () => useContext(AppContext);

        // --- Shared Components (Dark Mode) ---
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-surface rounded-xl shadow-2xl border border-borderDark w-full max-w-lg flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b border-borderDark flex justify-between items-center bg-surfaceAlt rounded-t-xl">
                            <h3 className="text-xl font-bold text-white">{title}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-danger transition-colors">
                                <i className="fas fa-times text-xl"></i>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, onClose, onConfirm, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4">
                    <div className="bg-surface rounded-lg shadow-xl border border-borderDark w-full max-w-sm p-6 text-center">
                        <i className="fas fa-exclamation-circle text-5xl text-warning mb-4"></i>
                        <p className="text-lg font-bold text-white mb-6">{message}</p>
                        <div className="flex gap-3 justify-center">
                            <button onClick={onConfirm} className="px-6 py-2 bg-danger text-white rounded-lg font-bold hover:bg-red-700">تأكيد</button>
                            <button onClick={onClose} className="px-6 py-2 bg-surfaceAlt text-white rounded-lg font-bold hover:bg-gray-600 border border-borderDark">إلغاء</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Modules ---

        const Dashboard = () => {
            const { sales, products, expenses } = useAppContext();
            const totalSales = sales.reduce((sum, sale) => sum + sale.total, 0);
            const totalExpenses = expenses.reduce((sum, exp) => sum + exp.amount, 0);
            
            let cogs = 0;
            sales.forEach(sale => {
                sale.items.forEach(item => {
                    cogs += (item.buyPrice * item.qty);
                });
            });
            const grossProfit = totalSales - cogs;
            const netProfit = grossProfit - totalExpenses;
            const lowStockProducts = products.filter(p => p.stock <= 5);

            return (
                <div className="p-6 h-full overflow-y-auto">
                    <h2 className="text-2xl font-bold text-white mb-6"><i className="fas fa-chart-line ml-2 text-primary"></i>نظرة عامة</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div className="bg-surface rounded-xl p-6 shadow-sm border border-borderDark flex items-center border-r-4 border-r-primary">
                            <div className="w-12 h-12 rounded-full bg-blue-900/50 flex items-center justify-center text-primary text-xl ml-4"><i className="fas fa-money-bill-wave"></i></div>
                            <div>
                                <p className="text-sm text-gray-400 font-medium">إجمالي المبيعات</p>
                                <p className="text-2xl font-bold text-white">{formatCurrency(totalSales)}</p>
                            </div>
                        </div>
                        <div className="bg-surface rounded-xl p-6 shadow-sm border border-borderDark flex items-center border-r-4 border-r-success">
                            <div className="w-12 h-12 rounded-full bg-green-900/50 flex items-center justify-center text-success text-xl ml-4"><i className="fas fa-wallet"></i></div>
                            <div>
                                <p className="text-sm text-gray-400 font-medium">صافي الربح التقديري</p>
                                <p className={`text-2xl font-bold ${netProfit < 0 ? 'text-danger' : 'text-white'}`}>{formatCurrency(netProfit)}</p>
                            </div>
                        </div>
                        <div className="bg-surface rounded-xl p-6 shadow-sm border border-borderDark flex items-center border-r-4 border-r-warning">
                            <div className="w-12 h-12 rounded-full bg-orange-900/50 flex items-center justify-center text-warning text-xl ml-4"><i className="fas fa-boxes"></i></div>
                            <div>
                                <p className="text-sm text-gray-400 font-medium">عدد المنتجات</p>
                                <p className="text-2xl font-bold text-white">{products.length}</p>
                            </div>
                        </div>
                        <div className="bg-surface rounded-xl p-6 shadow-sm border border-borderDark flex items-center border-r-4 border-r-danger">
                            <div className="w-12 h-12 rounded-full bg-red-900/50 flex items-center justify-center text-danger text-xl ml-4"><i className="fas fa-exclamation-triangle"></i></div>
                            <div>
                                <p className="text-sm text-gray-400 font-medium">نواقص المخزون</p>
                                <p className="text-2xl font-bold text-white">{lowStockProducts.length}</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-surface rounded-xl shadow-sm border border-borderDark p-6">
                            <h3 className="text-lg font-bold text-white mb-4 pb-2 border-b border-borderDark">منتجات أوشكت على النفاد (أقل من 5)</h3>
                            {lowStockProducts.length > 0 ? (
                                <table className="w-full text-right">
                                    <thead className="text-gray-400 text-sm">
                                        <tr>
                                            <th className="pb-3">المنتج</th>
                                            <th className="pb-3 text-center">المتبقي</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {lowStockProducts.map(p => (
                                            <tr key={p.id} className="border-t border-borderDark">
                                                <td className="py-3 font-medium text-gray-200">{p.name}</td>
                                                <td className="py-3 text-center text-danger font-bold">{p.stock}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            ) : (
                                <p className="text-gray-400 text-center py-4">لا توجد نواقص حالياً</p>
                            )}
                        </div>

                        <div className="bg-surface rounded-xl shadow-sm border border-borderDark p-6">
                            <h3 className="text-lg font-bold text-white mb-4 pb-2 border-b border-borderDark">آخر الفواتير</h3>
                            <div className="space-y-3">
                                {sales.slice(-5).reverse().map(sale => (
                                    <div key={sale.id} className="flex justify-between items-center p-3 bg-surfaceAlt rounded-lg border border-borderDark">
                                        <div>
                                            <p className="font-bold text-white">{sale.id}</p>
                                            <p className="text-xs text-gray-400">{formatDate(sale.date)}</p>
                                        </div>
                                        <p className="font-bold text-primary">{formatCurrency(sale.total)}</p>
                                    </div>
                                ))}
                                {sales.length === 0 && <p className="text-gray-400 text-center py-4">لا توجد مبيعات بعد</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const POS = () => {
            const { products, setProducts, sales, setSales, showToast, setPrintData } = useAppContext();
            const [cart, setCart] = useState([]);
            const [search, setSearch] = useState('');
            const [paid, setPaid] = useState('');
            
            const barcodeInputRef = useRef(null);

            useEffect(() => { barcodeInputRef.current?.focus(); }, [cart]);

            const filteredProducts = products.filter(p => p.name.includes(search) || (p.barcode && p.barcode.includes(search)));

            const addToCart = (product) => {
                if (product.stock <= 0) return showToast('المنتج نفد من المخزون!', 'error');
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    if (existing.qty >= product.stock) return showToast('الكمية المطلوبة تتجاوز المخزون!', 'error');
                    setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
                } else {
                    setCart([...cart, { ...product, qty: 1 }]);
                }
            };

            const updateQty = (id, newQty) => {
                if (newQty <= 0) return setCart(cart.filter(item => item.id !== id));
                const product = products.find(p => p.id === id);
                if (newQty > product.stock) return showToast('الكمية تتجاوز المخزون المتاح!', 'error');
                setCart(cart.map(item => item.id === id ? { ...item, qty: newQty } : item));
            };

            const handleBarcodeScan = (e) => {
                e.preventDefault();
                if(!search) return;
                const product = products.find(p => p.barcode === search);
                if (product) {
                    addToCart(product);
                    setSearch('');
                } else {
                    showToast('باركود غير مسجل', 'error');
                }
            };

            const total = cart.reduce((sum, item) => sum + (item.sellPrice * item.qty), 0);
            const change = (Number(paid) || 0) - total;

            const handleCheckout = () => {
                if (cart.length === 0) return showToast('السلة فارغة', 'error');
                if (Number(paid) < total) return showToast('المبلغ المدفوع أقل من الإجمالي', 'error');

                const updatedProducts = products.map(p => {
                    const cartItem = cart.find(i => i.id === p.id);
                    return cartItem ? { ...p, stock: p.stock - cartItem.qty } : p;
                });
                setProducts(updatedProducts);

                const saleRecord = {
                    id: 'INV-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    items: cart.map(i => ({ name: i.name, qty: i.qty, price: i.sellPrice, total: i.qty * i.sellPrice, buyPrice: i.buyPrice })),
                    total: total,
                    paid: Number(paid),
                    change: change > 0 ? change : 0
                };
                setSales([...sales, saleRecord]);
                setPrintData(saleRecord);
                setTimeout(() => { window.print(); setPrintData(null); }, 500);

                setCart([]); setPaid(''); setSearch('');
                showToast('تم حفظ الفاتورة بنجاح');
            };

            return (
                <div className="flex h-full bg-background overflow-hidden">
                    <div className="flex-1 flex flex-col p-4 overflow-hidden">
                        <form onSubmit={handleBarcodeScan} className="mb-4 relative shadow-sm">
                            <i className="fas fa-barcode absolute right-4 top-3.5 text-gray-400 text-lg"></i>
                            <input 
                                ref={barcodeInputRef}
                                type="text" 
                                placeholder="ابحث بالاسم أو امسح الباركود..." 
                                className="w-full pl-4 pr-12 py-3 rounded-xl border border-borderDark focus:ring-1 focus:ring-primary outline-none text-lg bg-surfaceAlt text-white"
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                            />
                            {search && (
                                <button type="button" onClick={() => setSearch('')} className="absolute left-4 top-3.5 text-gray-400 hover:text-danger">
                                    <i className="fas fa-times"></i>
                                </button>
                            )}
                        </form>

                        <div className="flex-1 overflow-y-auto pr-2 pb-4">
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                                {filteredProducts.map(product => (
                                    <div 
                                        key={product.id} 
                                        onClick={() => addToCart(product)}
                                        className={`bg-surface rounded-xl p-4 border border-borderDark cursor-pointer hover:bg-surfaceAlt hover:border-primary/50 transition flex flex-col justify-between h-32 select-none ${product.stock <= 0 ? 'opacity-50 grayscale' : ''}`}
                                    >
                                        <div>
                                            <h4 className="font-bold text-white text-sm leading-tight line-clamp-2">{product.name}</h4>
                                            <span className="text-xs text-gray-400 mt-1 block">{product.barcode || 'بدون باركود'}</span>
                                        </div>
                                        <div className="flex justify-between items-end mt-2">
                                            <span className="font-bold text-primary">{product.sellPrice} ج</span>
                                            <span className={`text-xs font-bold px-2 py-1 rounded ${product.stock > 5 ? 'bg-green-900/50 text-success' : 'bg-red-900/50 text-danger'}`}>متاح: {product.stock}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {filteredProducts.length === 0 && (
                                <div className="text-center text-gray-500 mt-20 flex flex-col items-center">
                                    <i className="fas fa-box-open text-6xl mb-4 opacity-50"></i>
                                    <p className="text-lg">لا توجد منتجات تطابق البحث</p>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="w-[380px] bg-surface z-10 flex flex-col border-r border-borderDark shadow-xl">
                        <div className="p-4 bg-surfaceAlt border-b border-borderDark flex justify-between items-center">
                            <h3 className="text-lg font-bold text-white"><i className="fas fa-shopping-cart ml-2 text-primary"></i>سلة المشتريات</h3>
                            <button onClick={() => setCart([])} className="text-danger hover:bg-red-900/30 p-2 rounded-lg text-sm font-bold transition">إفراغ <i className="fas fa-trash ml-1"></i></button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {cart.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-500">
                                    <i className="fas fa-basket-shopping text-6xl mb-4"></i>
                                    <p>السلة فارغة، ابدأ بإضافة المنتجات</p>
                                </div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} className="bg-surfaceAlt border border-borderDark p-3 rounded-lg flex justify-between items-center">
                                        <div className="flex-1">
                                            <h4 className="font-bold text-white text-sm">{item.name}</h4>
                                            <p className="text-xs text-primary font-bold">{item.sellPrice} ج</p>
                                        </div>
                                        <div className="flex items-center gap-2 bg-surface border border-borderDark rounded-lg px-2 py-1">
                                            <button onClick={() => updateQty(item.id, item.qty - 1)} className="text-gray-400 hover:text-danger px-1"><i className="fas fa-minus"></i></button>
                                            <span className="font-bold w-6 text-center text-white">{item.qty}</span>
                                            <button onClick={() => updateQty(item.id, item.qty + 1)} className="text-gray-400 hover:text-success px-1"><i className="fas fa-plus"></i></button>
                                        </div>
                                        <div className="w-16 text-left font-bold text-white mr-2">
                                            {item.sellPrice * item.qty} ج
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="p-6 bg-surfaceAlt border-t border-borderDark">
                            <div className="flex justify-between items-center mb-4 border-b border-borderDark pb-4">
                                <span className="text-gray-400 font-bold text-lg">الإجمالي:</span>
                                <span className="text-3xl font-black text-primary">{formatCurrency(total)}</span>
                            </div>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 mb-1">المبلغ المدفوع من العميل</label>
                                    <input 
                                        type="number" 
                                        className="w-full border-2 border-borderDark rounded-xl px-4 py-3 text-xl font-bold text-center focus:border-primary focus:outline-none bg-surface text-white"
                                        placeholder="0"
                                        value={paid}
                                        onChange={e => setPaid(e.target.value)}
                                        min={total}
                                    />
                                </div>
                                
                                {Number(paid) > 0 && Number(paid) >= total && (
                                    <div className="flex justify-between items-center bg-green-900/30 p-3 rounded-lg border border-success/30">
                                        <span className="text-success font-bold">الباقي للعميل:</span>
                                        <span className="text-xl font-black text-success">{formatCurrency(change)}</span>
                                    </div>
                                )}

                                <button 
                                    onClick={handleCheckout}
                                    disabled={cart.length === 0 || Number(paid) < total}
                                    className={`w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all ${
                                        cart.length === 0 || Number(paid) < total 
                                        ? 'bg-surface border border-borderDark text-gray-500 cursor-not-allowed' 
                                        : 'bg-primary hover:bg-blue-600 text-white shadow-lg transform hover:-translate-y-1'
                                    }`}
                                >
                                    <i className="fas fa-print"></i> دفع وإصدار الفاتورة
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Products = () => {
            const { products, setProducts, showToast } = useAppContext();
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [search, setSearch] = useState('');
            
            const initialForm = { id: '', name: '', barcode: '', category: '', buyPrice: '', sellPrice: '', stock: '' };
            const [formData, setFormData] = useState(initialForm);

            const filteredProducts = products.filter(p => p.name.includes(search) || (p.barcode && p.barcode.includes(search)));

            const openModal = (product = null) => {
                setFormData(product ? { ...product } : { ...initialForm, id: generateId() });
                setIsModalOpen(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.buyPrice || !formData.sellPrice || formData.stock === '') {
                    return showToast('الرجاء إكمال جميع الحقول الأساسية', 'error');
                }
                if (formData.barcode) {
                    const isDuplicate = products.some(p => p.barcode === formData.barcode && p.id !== formData.id);
                    if (isDuplicate) return showToast('هذا الباركود مسجل لمنتج آخر!', 'error');
                }

                const newProduct = { ...formData, buyPrice: Number(formData.buyPrice), sellPrice: Number(formData.sellPrice), stock: Number(formData.stock) };
                const existingIndex = products.findIndex(p => p.id === formData.id);
                if (existingIndex >= 0) {
                    const newProducts = [...products];
                    newProducts[existingIndex] = newProduct;
                    setProducts(newProducts);
                    showToast('تم تحديث المنتج بنجاح');
                } else {
                    setProducts([...products, newProduct]);
                    showToast('تمت إضافة المنتج بنجاح');
                }
                setIsModalOpen(false);
            };

            const handleDelete = () => {
                setProducts(products.filter(p => p.id !== deleteConfirm));
                setDeleteConfirm(null);
                showToast('تم حذف المنتج');
            };

            return (
                <div className="p-6 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-white"><i className="fas fa-boxes ml-2 text-primary"></i>إدارة المنتجات والمخزون</h2>
                        <button onClick={() => openModal()} className="bg-primary hover:bg-blue-600 text-white px-5 py-2.5 rounded-lg font-bold shadow-md transition flex items-center gap-2">
                            <i className="fas fa-plus"></i> إضافة منتج
                        </button>
                    </div>

                    <div className="bg-surface p-4 rounded-xl shadow-sm border border-borderDark mb-6 flex gap-4">
                        <div className="relative flex-1">
                            <i className="fas fa-search absolute right-4 top-3.5 text-gray-400"></i>
                            <input 
                                type="text" 
                                placeholder="بحث بالاسم أو الباركود..." 
                                className="w-full pl-4 pr-12 py-3 border border-borderDark bg-surfaceAlt text-white rounded-lg focus:outline-none focus:border-primary"
                                value={search} onChange={e => setSearch(e.target.value)}
                            />
                        </div>
                    </div>

                    <div className="flex-1 bg-surface rounded-xl shadow-sm border border-borderDark overflow-hidden flex flex-col">
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-right">
                                <thead className="bg-surfaceAlt border-b border-borderDark sticky top-0">
                                    <tr>
                                        <th className="p-4 text-gray-300 font-bold">المنتج / الباركود</th>
                                        <th className="p-4 text-gray-300 font-bold">التصنيف</th>
                                        <th className="p-4 text-gray-300 font-bold">سعر الشراء</th>
                                        <th className="p-4 text-gray-300 font-bold">سعر البيع</th>
                                        <th className="p-4 text-gray-300 font-bold">المخزون</th>
                                        <th className="p-4 text-gray-300 font-bold text-center">إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredProducts.map(product => (
                                        <tr key={product.id} className="border-b border-borderDark hover:bg-surfaceAlt transition">
                                            <td className="p-4">
                                                <div className="font-bold text-white">{product.name}</div>
                                                <div className="text-xs text-gray-400 font-mono mt-1">{product.barcode || '---'}</div>
                                            </td>
                                            <td className="p-4 text-gray-300">{product.category || 'عام'}</td>
                                            <td className="p-4 text-gray-300">{product.buyPrice} ج</td>
                                            <td className="p-4 font-bold text-primary">{product.sellPrice} ج</td>
                                            <td className="p-4">
                                                <span className={`px-3 py-1 rounded-full text-xs font-bold ${product.stock <= 5 ? 'bg-red-900/50 text-danger' : 'bg-green-900/50 text-success'}`}>
                                                    {product.stock}
                                                </span>
                                            </td>
                                            <td className="p-4 text-center">
                                                <button onClick={() => openModal(product)} className="w-8 h-8 rounded-full bg-blue-900/30 text-primary hover:bg-primary hover:text-white transition mx-1"><i className="fas fa-pen"></i></button>
                                                <button onClick={() => setDeleteConfirm(product.id)} className="w-8 h-8 rounded-full bg-red-900/30 text-danger hover:bg-danger hover:text-white transition mx-1"><i className="fas fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {filteredProducts.length === 0 && (
                                <div className="text-center text-gray-500 py-12">لا توجد منتجات مسجلة تطابق البحث</div>
                            )}
                        </div>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={products.find(p=>p.id === formData.id) ? 'تعديل المنتج' : 'إضافة منتج جديد'}>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="col-span-2">
                                    <label className="block text-sm font-bold text-gray-300 mb-1">اسم المنتج <span className="text-danger">*</span></label>
                                    <input type="text" className="w-full border border-borderDark rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-surfaceAlt text-white" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-300 mb-1">الباركود</label>
                                    <input type="text" className="w-full border border-borderDark rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-surfaceAlt text-white font-mono text-left dir-ltr" value={formData.barcode} onChange={e => setFormData({...formData, barcode: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-300 mb-1">التصنيف</label>
                                    <input type="text" className="w-full border border-borderDark rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-surfaceAlt text-white" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-300 mb-1">سعر الشراء (التكلفة) <span className="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" className="w-full border border-borderDark rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-surfaceAlt text-white" value={formData.buyPrice} onChange={e => setFormData({...formData, buyPrice: e.target.value})} required />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-300 mb-1">سعر البيع للجمهور <span className="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" className="w-full border border-borderDark rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-surfaceAlt text-white" value={formData.sellPrice} onChange={e => setFormData({...formData, sellPrice: e.target.value})} required />
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-sm font-bold text-gray-300 mb-1">الكمية في المخزون <span className="text-danger">*</span></label>
                                    <input type="number" min="0" className="w-full border border-borderDark rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-surfaceAlt text-white" value={formData.stock} onChange={e => setFormData({...formData, stock: e.target.value})} required />
                                </div>
                            </div>
                            <div className="pt-6 mt-4 border-t border-borderDark flex justify-end gap-3">
                                <button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-2 bg-surfaceAlt border border-borderDark text-white rounded-lg font-bold hover:bg-gray-700 transition">إلغاء</button>
                                <button type="submit" className="px-6 py-2 bg-primary text-white rounded-lg font-bold hover:bg-blue-600 transition">حفظ المنتج</button>
                            </div>
                        </form>
                    </Modal>

                    <ConfirmModal isOpen={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} onConfirm={handleDelete} message="هل أنت متأكد من حذف هذا المنتج نهائياً؟" />
                </div>
            );
        };

        const Invoices = () => {
            const { sales, setPrintData } = useAppContext();

            const handleRePrint = (sale) => {
                setPrintData(sale);
                setTimeout(() => { window.print(); setPrintData(null); }, 300);
            };

            return (
                <div className="p-6 h-full flex flex-col">
                    <h2 className="text-2xl font-bold text-white mb-6"><i className="fas fa-file-invoice-dollar ml-2 text-primary"></i>سجل الفواتير والمبيعات</h2>
                    
                    <div className="flex-1 bg-surface rounded-xl shadow-sm border border-borderDark overflow-hidden flex flex-col">
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-right">
                                <thead className="bg-surfaceAlt border-b border-borderDark sticky top-0">
                                    <tr>
                                        <th className="p-4 text-gray-300 font-bold">رقم الفاتورة</th>
                                        <th className="p-4 text-gray-300 font-bold">التاريخ والوقت</th>
                                        <th className="p-4 text-gray-300 font-bold">الأصناف</th>
                                        <th className="p-4 text-gray-300 font-bold">الإجمالي</th>
                                        <th className="p-4 text-gray-300 font-bold text-center">طباعة</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...sales].reverse().map(sale => (
                                        <tr key={sale.id} className="border-b border-borderDark hover:bg-surfaceAlt transition">
                                            <td className="p-4 font-bold text-white">{sale.id}</td>
                                            <td className="p-4 text-gray-300">{formatDate(sale.date)}</td>
                                            <td className="p-4 text-gray-300 text-sm">
                                                {sale.items.map(i => `${i.name} (x${i.qty})`).join('، ')}
                                            </td>
                                            <td className="p-4 font-bold text-primary">{formatCurrency(sale.total)}</td>
                                            <td className="p-4 text-center">
                                                <button onClick={() => handleRePrint(sale)} className="w-10 h-10 rounded-lg bg-surfaceAlt border border-borderDark text-gray-300 hover:bg-primary hover:text-white hover:border-primary transition shadow-sm" title="إعادة طباعة الفاتورة">
                                                    <i className="fas fa-print"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {sales.length === 0 && (
                                <div className="text-center text-gray-500 py-12">لا توجد مبيعات مسجلة حتى الآن</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Expenses = () => {
            const { expenses, setExpenses, showToast } = useAppContext();
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({ id: '', desc: '', amount: '', date: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.desc || !formData.amount) return;
                
                setExpenses([...expenses, {
                    id: generateId(), desc: formData.desc, amount: Number(formData.amount), date: new Date().toISOString()
                }]);
                showToast('تم تسجيل المصروف بنجاح');
                setIsModalOpen(false);
                setFormData({ id: '', desc: '', amount: '', date: '' });
            };

            return (
                <div className="p-6 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-white"><i className="fas fa-money-bill-trend-up ml-2 text-primary"></i>المصروفات اليومية</h2>
                        <button onClick={() => setIsModalOpen(true)} className="bg-danger hover:bg-red-600 text-white px-5 py-2.5 rounded-lg font-bold shadow-md transition flex items-center gap-2">
                            <i className="fas fa-minus-circle"></i> تسجيل مصروف
                        </button>
                    </div>

                    <div className="flex-1 bg-surface rounded-xl shadow-sm border border-borderDark overflow-hidden flex flex-col">
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-right">
                                <thead className="bg-surfaceAlt border-b border-borderDark sticky top-0">
                                    <tr>
                                        <th className="p-4 text-gray-300 font-bold">التاريخ</th>
                                        <th className="p-4 text-gray-300 font-bold">بيان المصروف</th>
                                        <th className="p-4 text-gray-300 font-bold">المبلغ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...expenses].reverse().map(exp => (
                                        <tr key={exp.id} className="border-b border-borderDark hover:bg-surfaceAlt transition">
                                            <td className="p-4 text-gray-300">{formatDate(exp.date)}</td>
                                            <td className="p-4 font-bold text-white">{exp.desc}</td>
                                            <td className="p-4 font-bold text-danger">{formatCurrency(exp.amount)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {expenses.length === 0 && (
                                <div className="text-center text-gray-500 py-12">لا توجد مصروفات مسجلة</div>
                            )}
                        </div>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="تسجيل مصروف جديد">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-gray-300 mb-1">البيان (مثال: إيجار، كهرباء، نظافة) <span className="text-danger">*</span></label>
                                <input type="text" className="w-full border border-borderDark rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-surfaceAlt text-white" value={formData.desc} onChange={e => setFormData({...formData, desc: e.target.value})} required />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-300 mb-1">المبلغ (ج.م) <span className="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" className="w-full border border-borderDark rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-surfaceAlt text-white" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} required />
                            </div>
                            <div className="pt-6 mt-4 border-t border-borderDark flex justify-end gap-3">
                                <button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-2 bg-surfaceAlt border border-borderDark text-white rounded-lg font-bold hover:bg-gray-700 transition">إلغاء</button>
                                <button type="submit" className="px-6 py-2 bg-danger text-white rounded-lg font-bold hover:bg-red-600 transition">حفظ المصروف</button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        const App = () => {
            const { activeTab, setActiveTab } = useAppContext();

            const menu = [
                { id: 'dashboard', label: 'لوحة التحكم', icon: 'fa-chart-pie' },
                { id: 'pos', label: 'شاشة الكاشير', icon: 'fa-desktop' },
                { id: 'products', label: 'المنتجات والمخزون', icon: 'fa-boxes' },
                { id: 'invoices', label: 'الفواتير', icon: 'fa-file-invoice' },
                { id: 'expenses', label: 'المصروفات', icon: 'fa-money-bill-wave' }
            ];

            return (
                <div className="flex h-screen w-full bg-background text-white">
                    {/* Sidebar */}
                    <aside className="w-64 bg-surface text-white flex flex-col z-20 shadow-2xl no-print border-l border-borderDark">
                        <div className="p-6 border-b border-borderDark flex flex-col items-center justify-center">
                            <div className="w-16 h-16 bg-gradient-to-tr from-primary to-blue-600 rounded-2xl flex items-center justify-center shadow-lg mb-3">
                                <i className="fas fa-store text-3xl text-white"></i>
                            </div>
                            <h1 className="text-xl font-bold tracking-wide">سوبر ماركت برو</h1>
                            <span className="text-xs text-primary mt-1 bg-primary/10 px-2 py-1 rounded-full border border-primary/20">الوضع الليلي 🌙</span>
                        </div>
                        <nav className="flex-1 py-4 overflow-y-auto">
                            <ul className="space-y-2 px-3">
                                {menu.map(item => (
                                    <li key={item.id}>
                                        <button 
                                            onClick={() => setActiveTab(item.id)}
                                            className={`w-full text-right px-4 py-3 rounded-xl transition-all flex items-center gap-3 font-bold ${activeTab === item.id ? 'bg-primary text-white shadow-md transform scale-[1.02]' : 'text-gray-400 hover:bg-surfaceAlt hover:text-white'}`}
                                        >
                                            <i className={`fas ${item.icon} w-6 text-center text-lg`}></i>
                                            {item.label}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col overflow-hidden relative no-print bg-background">
                        {activeTab === 'dashboard' && <Dashboard />}
                        {activeTab === 'pos' && <POS />}
                        {activeTab === 'products' && <Products />}
                        {activeTab === 'invoices' && <Invoices />}
                        {activeTab === 'expenses' && <Expenses />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppProvider><App /></AppProvider>);
    </script>
</body>
</html>
