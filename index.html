<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكاشير وإدارة السوبر ماركت</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0284c7', // light blue
                        secondary: '#1e293b', // slate
                        success: '#16a34a', // green
                        danger: '#dc2626', // red
                        warning: '#d97706', // amber
                        background: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            overflow: hidden; /* Prevent body scroll, handle inside components */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Thermal Print Styles (80mm) */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                margin: 0;
                padding: 0;
                font-family: 'Arial', sans-serif;
                font-size: 12px;
                color: black;
            }
            .no-print { display: none !important; }
            @page { margin: 0; }
        }
        
        .dashed-line { border-top: 1px dashed #000; margin: 8px 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useMemo, useRef } = React;

        // --- Custom Hooks for LocalStorage ---
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        }

        // --- Helpers ---
        const formatCurrency = (num) => new Intl.NumberFormat('ar-EG', { style: 'currency', currency: 'EGP' }).format(num || 0);
        const formatDate = (dateStr) => new Intl.DateTimeFormat('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(dateStr));
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- Context ---
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [products, setProducts] = useLocalStorage('pos_products', []);
            const [sales, setSales] = useLocalStorage('pos_sales', []);
            const [expenses, setExpenses] = useLocalStorage('pos_expenses', []);
            
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [printData, setPrintData] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const value = {
                products, setProducts,
                sales, setSales,
                expenses, setExpenses,
                activeTab, setActiveTab,
                showToast,
                printData, setPrintData
            };

            return (
                <AppContext.Provider value={value}>
                    {children}
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-xl text-white font-bold z-[100] flex items-center gap-3 transition-all animate-bounce ${toast.type === 'error' ? 'bg-danger' : 'bg-success'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'} text-xl`}></i>
                            {toast.message}
                        </div>
                    )}

                    {/* Hidden Print Area */}
                    <div id="print-area" className="hidden print:block bg-white p-2">
                        {printData && (
                            <div dir="rtl">
                                <h2 className="text-center font-bold text-lg mb-1">سوبر ماركت النور</h2>
                                <p className="text-center text-xs mb-3">رقم الفاتورة: {printData.id}</p>
                                <p className="text-xs mb-2">التاريخ: {formatDate(printData.date)}</p>
                                <div className="dashed-line"></div>
                                <table className="w-full text-xs text-right">
                                    <thead>
                                        <tr>
                                            <th className="py-1">الصنف</th>
                                            <th className="py-1 text-center">الكمية</th>
                                            <th className="py-1 text-left">السعر</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {printData.items.map((item, idx) => (
                                            <tr key={idx}>
                                                <td className="py-1">{item.name}</td>
                                                <td className="py-1 text-center">{item.qty}</td>
                                                <td className="py-1 text-left">{item.total}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div className="dashed-line"></div>
                                <div className="text-xs font-bold flex justify-between py-1">
                                    <span>الإجمالي:</span>
                                    <span>{printData.total} ج.م</span>
                                </div>
                                <div className="text-xs flex justify-between py-1">
                                    <span>المدفوع:</span>
                                    <span>{printData.paid} ج.م</span>
                                </div>
                                <div className="text-xs flex justify-between py-1">
                                    <span>الباقي:</span>
                                    <span>{printData.change} ج.م</span>
                                </div>
                                <div className="dashed-line mt-3"></div>
                                <p className="text-center text-xs mt-2 font-bold">شكراً لزيارتكم!</p>
                            </div>
                        )}
                    </div>
                </AppContext.Provider>
            );
        };

        const useAppContext = () => useContext(AppContext);

        // --- Shared Components ---
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                            <h3 className="text-xl font-bold text-secondary">{title}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-danger transition-colors">
                                <i className="fas fa-times text-xl"></i>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, onClose, onConfirm, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-sm p-6 text-center">
                        <i className="fas fa-exclamation-circle text-5xl text-warning mb-4"></i>
                        <p className="text-lg font-bold text-gray-800 mb-6">{message}</p>
                        <div className="flex gap-3 justify-center">
                            <button onClick={onConfirm} className="px-6 py-2 bg-danger text-white rounded-lg font-bold hover:bg-red-700">تأكيد</button>
                            <button onClick={onClose} className="px-6 py-2 bg-gray-200 text-gray-800 rounded-lg font-bold hover:bg-gray-300">إلغاء</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Modules ---

        // 1. Dashboard
        const Dashboard = () => {
            const { sales, products, expenses } = useAppContext();

            const totalSales = sales.reduce((sum, sale) => sum + sale.total, 0);
            const totalExpenses = expenses.reduce((sum, exp) => sum + exp.amount, 0);
            
            // Profit Calculation (Sales Total - COGS) - Expenses
            let cogs = 0;
            sales.forEach(sale => {
                sale.items.forEach(item => {
                    cogs += (item.buyPrice * item.qty);
                });
            });
            const grossProfit = totalSales - cogs;
            const netProfit = grossProfit - totalExpenses;

            const lowStockProducts = products.filter(p => p.stock <= 5);

            return (
                <div className="p-6 h-full overflow-y-auto">
                    <h2 className="text-2xl font-bold text-secondary mb-6"><i className="fas fa-chart-line ml-2"></i>نظرة عامة</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div className="bg-white rounded-xl p-6 shadow-sm border border-gray-100 flex items-center border-r-4 border-r-primary">
                            <div className="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-primary text-xl ml-4"><i className="fas fa-money-bill-wave"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">إجمالي المبيعات</p>
                                <p className="text-2xl font-bold text-gray-800">{formatCurrency(totalSales)}</p>
                            </div>
                        </div>
                        <div className="bg-white rounded-xl p-6 shadow-sm border border-gray-100 flex items-center border-r-4 border-r-success">
                            <div className="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-success text-xl ml-4"><i className="fas fa-wallet"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">صافي الربح التقديري</p>
                                <p className={`text-2xl font-bold ${netProfit < 0 ? 'text-danger' : 'text-gray-800'}`}>{formatCurrency(netProfit)}</p>
                            </div>
                        </div>
                        <div className="bg-white rounded-xl p-6 shadow-sm border border-gray-100 flex items-center border-r-4 border-r-warning">
                            <div className="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-warning text-xl ml-4"><i className="fas fa-boxes"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">عدد المنتجات</p>
                                <p className="text-2xl font-bold text-gray-800">{products.length}</p>
                            </div>
                        </div>
                        <div className="bg-white rounded-xl p-6 shadow-sm border border-gray-100 flex items-center border-r-4 border-r-danger">
                            <div className="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-danger text-xl ml-4"><i className="fas fa-exclamation-triangle"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">نواقص المخزون</p>
                                <p className="text-2xl font-bold text-gray-800">{lowStockProducts.length}</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                            <h3 className="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">منتجات أوشكت على النفاد (أقل من 5)</h3>
                            {lowStockProducts.length > 0 ? (
                                <table className="w-full text-right">
                                    <thead className="text-gray-500 text-sm">
                                        <tr>
                                            <th className="pb-3">المنتج</th>
                                            <th className="pb-3 text-center">المتبقي</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {lowStockProducts.map(p => (
                                            <tr key={p.id} className="border-t border-gray-50">
                                                <td className="py-3 font-medium">{p.name}</td>
                                                <td className="py-3 text-center text-danger font-bold">{p.stock}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            ) : (
                                <p className="text-gray-500 text-center py-4">لا توجد نواقص حالياً</p>
                            )}
                        </div>

                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                            <h3 className="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">آخر الفواتير</h3>
                            <div className="space-y-3">
                                {sales.slice(-5).reverse().map(sale => (
                                    <div key={sale.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                        <div>
                                            <p className="font-bold text-gray-800">{sale.id}</p>
                                            <p className="text-xs text-gray-500">{formatDate(sale.date)}</p>
                                        </div>
                                        <p className="font-bold text-primary">{formatCurrency(sale.total)}</p>
                                    </div>
                                ))}
                                {sales.length === 0 && <p className="text-gray-500 text-center py-4">لا توجد مبيعات بعد</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. POS
        const POS = () => {
            const { products, setProducts, sales, setSales, showToast, setPrintData } = useAppContext();
            const [cart, setCart] = useState([]);
            const [search, setSearch] = useState('');
            const [paid, setPaid] = useState('');
            
            const barcodeInputRef = useRef(null);

            // Keep focus on input for fast barcode scanning
            useEffect(() => {
                barcodeInputRef.current?.focus();
            }, [cart]);

            const filteredProducts = products.filter(p => 
                p.name.includes(search) || (p.barcode && p.barcode.includes(search))
            );

            const addToCart = (product) => {
                if (product.stock <= 0) return showToast('المنتج نفد من المخزون!', 'error');
                
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    if (existing.qty >= product.stock) return showToast('الكمية المطلوبة تتجاوز المخزون!', 'error');
                    setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
                } else {
                    setCart([...cart, { ...product, qty: 1 }]);
                }
            };

            const updateQty = (id, newQty) => {
                if (newQty <= 0) return setCart(cart.filter(item => item.id !== id));
                const product = products.find(p => p.id === id);
                if (newQty > product.stock) return showToast('الكمية تتجاوز المخزون المتاح!', 'error');
                setCart(cart.map(item => item.id === id ? { ...item, qty: newQty } : item));
            };

            const handleBarcodeScan = (e) => {
                e.preventDefault();
                if(!search) return;
                const product = products.find(p => p.barcode === search);
                if (product) {
                    addToCart(product);
                    setSearch('');
                } else {
                    showToast('باركود غير مسجل', 'error');
                }
            };

            const total = cart.reduce((sum, item) => sum + (item.sellPrice * item.qty), 0);
            const change = (Number(paid) || 0) - total;

            const handleCheckout = () => {
                if (cart.length === 0) return showToast('السلة فارغة', 'error');
                if (Number(paid) < total) return showToast('المبلغ المدفوع أقل من الإجمالي', 'error');

                // 1. Deduct Stock
                const updatedProducts = products.map(p => {
                    const cartItem = cart.find(i => i.id === p.id);
                    if (cartItem) {
                        return { ...p, stock: p.stock - cartItem.qty };
                    }
                    return p;
                });
                setProducts(updatedProducts);

                // 2. Create Sale Record
                const saleRecord = {
                    id: 'INV-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    items: cart.map(i => ({ name: i.name, qty: i.qty, price: i.sellPrice, total: i.qty * i.sellPrice, buyPrice: i.buyPrice })),
                    total: total,
                    paid: Number(paid),
                    change: change > 0 ? change : 0
                };
                setSales([...sales, saleRecord]);

                // 3. Set Print Data and trigger print
                setPrintData(saleRecord);
                setTimeout(() => { window.print(); setPrintData(null); }, 500);

                // 4. Reset POS
                setCart([]);
                setPaid('');
                setSearch('');
                showToast('تم حفظ الفاتورة وتحديث المخزون بنجاح');
            };

            return (
                <div className="flex h-full bg-gray-100 overflow-hidden">
                    {/* RIGHT SIDE: Products Grid */}
                    <div className="flex-1 flex flex-col p-4 overflow-hidden">
                        <form onSubmit={handleBarcodeScan} className="mb-4 relative shadow-sm">
                            <i className="fas fa-barcode absolute right-4 top-3.5 text-gray-400 text-lg"></i>
                            <input 
                                ref={barcodeInputRef}
                                type="text" 
                                placeholder="ابحث بالاسم أو امسح الباركود..." 
                                className="w-full pl-4 pr-12 py-3 rounded-xl border-none focus:ring-2 focus:ring-primary outline-none text-lg"
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                            />
                            {search && (
                                <button type="button" onClick={() => setSearch('')} className="absolute left-4 top-3.5 text-gray-400 hover:text-danger">
                                    <i className="fas fa-times"></i>
                                </button>
                            )}
                        </form>

                        <div className="flex-1 overflow-y-auto pr-2 pb-4">
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                                {filteredProducts.map(product => (
                                    <div 
                                        key={product.id} 
                                        onClick={() => addToCart(product)}
                                        className={`bg-white rounded-xl p-4 shadow-sm border border-gray-100 cursor-pointer hover:shadow-md transition flex flex-col justify-between h-32 select-none ${product.stock <= 0 ? 'opacity-50 grayscale' : ''}`}
                                    >
                                        <div>
                                            <h4 className="font-bold text-gray-800 text-sm leading-tight line-clamp-2">{product.name}</h4>
                                            <span className="text-xs text-gray-500 mt-1 block">{product.barcode || 'بدون باركود'}</span>
                                        </div>
                                        <div className="flex justify-between items-end mt-2">
                                            <span className="font-bold text-primary">{product.sellPrice} ج</span>
                                            <span className={`text-xs font-bold px-2 py-1 rounded ${product.stock > 5 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>متاح: {product.stock}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {filteredProducts.length === 0 && (
                                <div className="text-center text-gray-400 mt-20 flex flex-col items-center">
                                    <i className="fas fa-box-open text-6xl mb-4 opacity-50"></i>
                                    <p className="text-lg">لا توجد منتجات تطابق البحث</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* LEFT SIDE: Cart */}
                    <div className="w-[380px] bg-white shadow-xl z-10 flex flex-col border-r border-gray-200">
                        <div className="p-4 bg-gray-50 border-b flex justify-between items-center">
                            <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-shopping-cart ml-2 text-primary"></i>سلة المشتريات</h3>
                            <button onClick={() => setCart([])} className="text-danger hover:bg-red-50 p-2 rounded-lg text-sm font-bold transition">إفراغ <i className="fas fa-trash ml-1"></i></button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {cart.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400 opacity-60">
                                    <i className="fas fa-basket-shopping text-6xl mb-4"></i>
                                    <p>السلة فارغة، ابدأ بإضافة المنتجات</p>
                                </div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} className="bg-gray-50 border border-gray-100 p-3 rounded-lg flex justify-between items-center">
                                        <div className="flex-1">
                                            <h4 className="font-bold text-gray-800 text-sm">{item.name}</h4>
                                            <p className="text-xs text-primary font-bold">{item.sellPrice} ج</p>
                                        </div>
                                        <div className="flex items-center gap-2 bg-white border rounded-lg px-2 py-1 shadow-sm">
                                            <button onClick={() => updateQty(item.id, item.qty - 1)} className="text-gray-500 hover:text-danger px-1"><i className="fas fa-minus"></i></button>
                                            <span className="font-bold w-6 text-center">{item.qty}</span>
                                            <button onClick={() => updateQty(item.id, item.qty + 1)} className="text-gray-500 hover:text-success px-1"><i className="fas fa-plus"></i></button>
                                        </div>
                                        <div className="w-16 text-left font-bold text-gray-800 mr-2">
                                            {item.sellPrice * item.qty} ج
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="p-6 bg-white border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                            <div className="flex justify-between items-center mb-4 border-b pb-4">
                                <span className="text-gray-500 font-bold text-lg">الإجمالي:</span>
                                <span className="text-3xl font-black text-primary">{formatCurrency(total)}</span>
                            </div>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">المبلغ المدفوع من العميل</label>
                                    <input 
                                        type="number" 
                                        className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-xl font-bold text-center focus:border-primary focus:outline-none bg-gray-50"
                                        placeholder="0"
                                        value={paid}
                                        onChange={e => setPaid(e.target.value)}
                                        min={total}
                                    />
                                </div>
                                
                                {Number(paid) > 0 && Number(paid) >= total && (
                                    <div className="flex justify-between items-center bg-green-50 p-3 rounded-lg border border-green-100">
                                        <span className="text-success font-bold">الباقي للعميل:</span>
                                        <span className="text-xl font-black text-success">{formatCurrency(change)}</span>
                                    </div>
                                )}

                                <button 
                                    onClick={handleCheckout}
                                    disabled={cart.length === 0 || Number(paid) < total}
                                    className={`w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all ${
                                        cart.length === 0 || Number(paid) < total 
                                        ? 'bg-gray-200 text-gray-400 cursor-not-allowed' 
                                        : 'bg-primary hover:bg-blue-700 text-white shadow-lg transform hover:-translate-y-1'
                                    }`}
                                >
                                    <i className="fas fa-print"></i> دفع وإصدار الفاتورة
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. Products Management
        const Products = () => {
            const { products, setProducts, showToast } = useAppContext();
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [search, setSearch] = useState('');
            
            const initialForm = { id: '', name: '', barcode: '', category: '', buyPrice: '', sellPrice: '', stock: '' };
            const [formData, setFormData] = useState(initialForm);

            const filteredProducts = products.filter(p => p.name.includes(search) || (p.barcode && p.barcode.includes(search)));

            const openModal = (product = null) => {
                setFormData(product ? { ...product } : { ...initialForm, id: generateId() });
                setIsModalOpen(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                // Form Validation
                if (!formData.name || !formData.buyPrice || !formData.sellPrice || formData.stock === '') {
                    return showToast('الرجاء إكمال جميع الحقول الأساسية', 'error');
                }

                // Barcode Duplicate Validation (allow empty barcodes, but if provided, must be unique)
                if (formData.barcode) {
                    const isDuplicate = products.some(p => p.barcode === formData.barcode && p.id !== formData.id);
                    if (isDuplicate) {
                        return showToast('هذا الباركود مسجل لمنتج آخر!', 'error');
                    }
                }

                const newProduct = {
                    ...formData,
                    buyPrice: Number(formData.buyPrice),
                    sellPrice: Number(formData.sellPrice),
                    stock: Number(formData.stock)
                };

                const existingIndex = products.findIndex(p => p.id === formData.id);
                if (existingIndex >= 0) {
                    const newProducts = [...products];
                    newProducts[existingIndex] = newProduct;
                    setProducts(newProducts);
                    showToast('تم تحديث المنتج بنجاح');
                } else {
                    setProducts([...products, newProduct]);
                    showToast('تمت إضافة المنتج بنجاح');
                }
                setIsModalOpen(false);
            };

            const handleDelete = () => {
                setProducts(products.filter(p => p.id !== deleteConfirm));
                setDeleteConfirm(null);
                showToast('تم حذف المنتج');
            };

            return (
                <div className="p-6 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-secondary"><i className="fas fa-boxes ml-2"></i>إدارة المنتجات والمخزون</h2>
                        <button onClick={() => openModal()} className="bg-primary hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-bold shadow-md transition flex items-center gap-2">
                            <i className="fas fa-plus"></i> إضافة منتج
                        </button>
                    </div>

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex gap-4">
                        <div className="relative flex-1">
                            <i className="fas fa-search absolute right-4 top-3.5 text-gray-400"></i>
                            <input 
                                type="text" 
                                placeholder="بحث بالاسم أو الباركود..." 
                                className="w-full pl-4 pr-12 py-3 border border-gray-200 rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"
                                value={search} onChange={e => setSearch(e.target.value)}
                            />
                        </div>
                    </div>

                    <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-right">
                                <thead className="bg-gray-50 border-b border-gray-200 sticky top-0">
                                    <tr>
                                        <th className="p-4 text-gray-600 font-bold">المنتج / الباركود</th>
                                        <th className="p-4 text-gray-600 font-bold">التصنيف</th>
                                        <th className="p-4 text-gray-600 font-bold">سعر الشراء</th>
                                        <th className="p-4 text-gray-600 font-bold">سعر البيع</th>
                                        <th className="p-4 text-gray-600 font-bold">المخزون</th>
                                        <th className="p-4 text-gray-600 font-bold text-center">إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredProducts.map(product => (
                                        <tr key={product.id} className="border-b border-gray-50 hover:bg-blue-50 transition">
                                            <td className="p-4">
                                                <div className="font-bold text-gray-800">{product.name}</div>
                                                <div className="text-xs text-gray-500 font-mono mt-1">{product.barcode || '---'}</div>
                                            </td>
                                            <td className="p-4 text-gray-600">{product.category || 'عام'}</td>
                                            <td className="p-4 text-gray-600">{product.buyPrice} ج</td>
                                            <td className="p-4 font-bold text-primary">{product.sellPrice} ج</td>
                                            <td className="p-4">
                                                <span className={`px-3 py-1 rounded-full text-xs font-bold ${product.stock <= 5 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                    {product.stock}
                                                </span>
                                            </td>
                                            <td className="p-4 text-center">
                                                <button onClick={() => openModal(product)} className="w-8 h-8 rounded-full bg-blue-100 text-primary hover:bg-primary hover:text-white transition mx-1"><i className="fas fa-pen"></i></button>
                                                <button onClick={() => setDeleteConfirm(product.id)} className="w-8 h-8 rounded-full bg-red-100 text-danger hover:bg-danger hover:text-white transition mx-1"><i className="fas fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {filteredProducts.length === 0 && (
                                <div className="text-center text-gray-500 py-12">لا توجد منتجات مسجلة تطابق البحث</div>
                            )}
                        </div>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={products.find(p=>p.id === formData.id) ? 'تعديل المنتج' : 'إضافة منتج جديد'}>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="col-span-2">
                                    <label className="block text-sm font-bold text-gray-700 mb-1">اسم المنتج <span className="text-danger">*</span></label>
                                    <input type="text" className="w-full border rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-gray-50" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">الباركود</label>
                                    <input type="text" className="w-full border rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-gray-50 font-mono text-left dir-ltr" value={formData.barcode} onChange={e => setFormData({...formData, barcode: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">التصنيف</label>
                                    <input type="text" className="w-full border rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-gray-50" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">سعر الشراء (التكلفة) <span className="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" className="w-full border rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-gray-50" value={formData.buyPrice} onChange={e => setFormData({...formData, buyPrice: e.target.value})} required />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">سعر البيع للجمهور <span className="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" className="w-full border rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-gray-50" value={formData.sellPrice} onChange={e => setFormData({...formData, sellPrice: e.target.value})} required />
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-sm font-bold text-gray-700 mb-1">الكمية في المخزون <span className="text-danger">*</span></label>
                                    <input type="number" min="0" className="w-full border rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-gray-50" value={formData.stock} onChange={e => setFormData({...formData, stock: e.target.value})} required />
                                </div>
                            </div>
                            <div className="pt-6 mt-4 border-t flex justify-end gap-3">
                                <button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-2 bg-gray-200 text-gray-800 rounded-lg font-bold hover:bg-gray-300 transition">إلغاء</button>
                                <button type="submit" className="px-6 py-2 bg-primary text-white rounded-lg font-bold hover:bg-blue-700 transition">حفظ المنتج</button>
                            </div>
                        </form>
                    </Modal>

                    <ConfirmModal 
                        isOpen={!!deleteConfirm} 
                        onClose={() => setDeleteConfirm(null)} 
                        onConfirm={handleDelete} 
                        message="هل أنت متأكد من حذف هذا المنتج نهائياً؟" 
                    />
                </div>
            );
        };

        // 4. Invoices
        const Invoices = () => {
            const { sales, setPrintData } = useAppContext();

            const handleRePrint = (sale) => {
                setPrintData(sale);
                setTimeout(() => { window.print(); setPrintData(null); }, 300);
            };

            return (
                <div className="p-6 h-full flex flex-col">
                    <h2 className="text-2xl font-bold text-secondary mb-6"><i className="fas fa-file-invoice-dollar ml-2"></i>سجل الفواتير والمبيعات</h2>
                    
                    <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-right">
                                <thead className="bg-gray-50 border-b border-gray-200 sticky top-0">
                                    <tr>
                                        <th className="p-4 text-gray-600 font-bold">رقم الفاتورة</th>
                                        <th className="p-4 text-gray-600 font-bold">التاريخ والوقت</th>
                                        <th className="p-4 text-gray-600 font-bold">الأصناف</th>
                                        <th className="p-4 text-gray-600 font-bold">الإجمالي</th>
                                        <th className="p-4 text-gray-600 font-bold text-center">طباعة</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...sales].reverse().map(sale => (
                                        <tr key={sale.id} className="border-b border-gray-50 hover:bg-gray-50 transition">
                                            <td className="p-4 font-bold text-gray-800">{sale.id}</td>
                                            <td className="p-4 text-gray-600">{formatDate(sale.date)}</td>
                                            <td className="p-4 text-gray-600 text-sm">
                                                {sale.items.map(i => `${i.name} (x${i.qty})`).join('، ')}
                                            </td>
                                            <td className="p-4 font-bold text-primary">{formatCurrency(sale.total)}</td>
                                            <td className="p-4 text-center">
                                                <button onClick={() => handleRePrint(sale)} className="w-10 h-10 rounded-lg bg-gray-100 text-gray-600 hover:bg-primary hover:text-white transition shadow-sm" title="إعادة طباعة الفاتورة">
                                                    <i className="fas fa-print"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {sales.length === 0 && (
                                <div className="text-center text-gray-500 py-12">لا توجد مبيعات مسجلة حتى الآن</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 5. Expenses
        const Expenses = () => {
            const { expenses, setExpenses, showToast } = useAppContext();
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({ id: '', desc: '', amount: '', date: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.desc || !formData.amount) return;
                
                setExpenses([...expenses, {
                    id: generateId(),
                    desc: formData.desc,
                    amount: Number(formData.amount),
                    date: new Date().toISOString()
                }]);
                showToast('تم تسجيل المصروف بنجاح');
                setIsModalOpen(false);
                setFormData({ id: '', desc: '', amount: '', date: '' });
            };

            return (
                <div className="p-6 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-secondary"><i className="fas fa-money-bill-trend-up ml-2"></i>المصروفات اليومية</h2>
                        <button onClick={() => setIsModalOpen(true)} className="bg-danger hover:bg-red-700 text-white px-5 py-2.5 rounded-lg font-bold shadow-md transition flex items-center gap-2">
                            <i className="fas fa-minus-circle"></i> تسجيل مصروف
                        </button>
                    </div>

                    <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-right">
                                <thead className="bg-gray-50 border-b border-gray-200 sticky top-0">
                                    <tr>
                                        <th className="p-4 text-gray-600 font-bold">التاريخ</th>
                                        <th className="p-4 text-gray-600 font-bold">بيان المصروف</th>
                                        <th className="p-4 text-gray-600 font-bold">المبلغ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...expenses].reverse().map(exp => (
                                        <tr key={exp.id} className="border-b border-gray-50 hover:bg-gray-50 transition">
                                            <td className="p-4 text-gray-600">{formatDate(exp.date)}</td>
                                            <td className="p-4 font-bold text-gray-800">{exp.desc}</td>
                                            <td className="p-4 font-bold text-danger">{formatCurrency(exp.amount)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {expenses.length === 0 && (
                                <div className="text-center text-gray-500 py-12">لا توجد مصروفات مسجلة</div>
                            )}
                        </div>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="تسجيل مصروف جديد">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">البيان (مثال: إيجار، كهرباء، نظافة) <span className="text-danger">*</span></label>
                                <input type="text" className="w-full border rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-gray-50" value={formData.desc} onChange={e => setFormData({...formData, desc: e.target.value})} required />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">المبلغ (ج.م) <span className="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" className="w-full border rounded-lg px-4 py-2 focus:border-primary focus:outline-none bg-gray-50" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} required />
                            </div>
                            <div className="pt-6 mt-4 border-t flex justify-end gap-3">
                                <button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-2 bg-gray-200 text-gray-800 rounded-lg font-bold hover:bg-gray-300 transition">إلغاء</button>
                                <button type="submit" className="px-6 py-2 bg-danger text-white rounded-lg font-bold hover:bg-red-700 transition">حفظ المصروف</button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };


        // --- Layout Shell ---
        const App = () => {
            const { activeTab, setActiveTab } = useAppContext();

            const menu = [
                { id: 'dashboard', label: 'لوحة التحكم', icon: 'fa-chart-pie' },
                { id: 'pos', label: 'شاشة الكاشير', icon: 'fa-desktop' },
                { id: 'products', label: 'المنتجات والمخزون', icon: 'fa-boxes' },
                { id: 'invoices', label: 'الفواتير', icon: 'fa-file-invoice' },
                { id: 'expenses', label: 'المصروفات', icon: 'fa-money-bill-wave' }
            ];

            return (
                <div className="flex h-screen w-full">
                    {/* Sidebar - hidden in print */}
                    <aside className="w-64 bg-secondary text-white flex flex-col z-20 shadow-2xl no-print">
                        <div className="p-6 border-b border-slate-700/50 flex flex-col items-center justify-center">
                            <div className="w-16 h-16 bg-gradient-to-tr from-primary to-blue-400 rounded-2xl flex items-center justify-center shadow-lg mb-3">
                                <i className="fas fa-store text-3xl text-white"></i>
                            </div>
                            <h1 className="text-xl font-bold tracking-wide">سوبر ماركت برو</h1>
                            <span className="text-xs text-slate-400 mt-1 bg-slate-800 px-2 py-1 rounded-full">نظام محلي (Offline)</span>
                        </div>
                        <nav className="flex-1 py-4 overflow-y-auto">
                            <ul className="space-y-2 px-3">
                                {menu.map(item => (
                                    <li key={item.id}>
                                        <button 
                                            onClick={() => setActiveTab(item.id)}
                                            className={`w-full text-right px-4 py-3 rounded-xl transition-all flex items-center gap-3 font-bold ${activeTab === item.id ? 'bg-primary text-white shadow-md transform scale-[1.02]' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                                        >
                                            <i className={`fas ${item.icon} w-6 text-center text-lg`}></i>
                                            {item.label}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                        <div className="p-4 border-t border-slate-700/50 text-center text-slate-400 text-sm">
                            V 2.0 (Local Storage)
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col overflow-hidden relative no-print bg-background">
                        {activeTab === 'dashboard' && <Dashboard />}
                        {activeTab === 'pos' && <POS />}
                        {activeTab === 'products' && <Products />}
                        {activeTab === 'invoices' && <Invoices />}
                        {activeTab === 'expenses' && <Expenses />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <App />
            </AppProvider>
        );
    </script>
</body>
</html>
